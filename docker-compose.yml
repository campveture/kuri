# Local Postgres for development. `docker compose up -d` then `npm run db:migrate`.
# Not used in production — Vercel connects to Neon.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuri
      POSTGRES_PASSWORD: kuri
      POSTGRES_DB: kuri
    ports:
      - "5432:5432"
    volumes:
      - kuri_pgdata:/var/lib/postgresql/data
volumes:
  kuri_pgdata:
